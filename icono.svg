<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mis Lugares">
  <!-- Fondo a sangre: el ícono "maskable" lo recorta el sistema, así que no
       lleva esquinas redondeadas propias. Es cartulina de boleto, no blanco. -->
  <rect width="512" height="512" fill="#F2E7D2"/>

  <!-- El sello: el mismo componente que marca ABIERTA / CERRADA dentro de la
       app, girado como una estampa puesta a mano. El alfiler ROMPE el filete
       de abajo: eso es lo que hace que se lea como estampa y no como marco.
       El halo color cartulina alrededor del alfiler es lo que abre ese corte
       (paint-order dibuja primero el trazo y encima el relleno). -->
  <g transform="rotate(-11 256 256)">
    <rect x="96" y="150" width="320" height="212" rx="26"
          fill="none" stroke="#BE2D1C" stroke-width="24"/>
    <path d="M256 394c0 0-58-62-58-116a58 58 0 1 1 116 0c0 54-58 116-58 116z"
          fill="#BE2D1C" stroke="#F2E7D2" stroke-width="20" paint-order="stroke"/>
    <circle cx="256" cy="248" r="22" fill="#F2E7D2"/>
  </g>
</svg>
